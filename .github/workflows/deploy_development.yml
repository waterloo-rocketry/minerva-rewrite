name: Deploy to Development

on:
  push:
    branches: [development]

jobs:
  deploy:
    name: Deploy Process
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
      - name: Install Dependencies
        run: corepack enable && yarn install --immutable
      - name: Run unit tests
        run: yarn test
      - name: Build
        run: yarn build
      - name: Generate .env file
        env:
          MINERVA_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.MINERVA_GOOGLE_SERVICE_ACCOUNT }}
          MINERVA_GOOGLE_IMPERSONATED_USER: ${{ vars.MINERVA_GOOGLE_IMPERSONATED_USER }}
          MINERVA_GOOGLE_CALENDAR_ID: ${{ vars.MINERVA_GOOGLE_CALENDAR_ID }}
        run: |
          touch .env
          # Single quotes keep dotenv from treating the JSON's `#` or `\n` specially; printf avoids shell re-parsing it
          printf "MINERVA_GOOGLE_SERVICE_ACCOUNT='%s'\n" "$MINERVA_GOOGLE_SERVICE_ACCOUNT" >> .env
          printf 'MINERVA_GOOGLE_IMPERSONATED_USER=%s\n' "$MINERVA_GOOGLE_IMPERSONATED_USER" >> .env
          printf 'MINERVA_GOOGLE_CALENDAR_ID=%s\n' "$MINERVA_GOOGLE_CALENDAR_ID" >> .env
          echo NODE_ENV=development >> .env
          echo GOOGLE_ACCOUNT_CLIENT=${{ secrets.GOOGLE_ACCOUNT_CLIENT }} >> .env
          echo GOOGLE_ACCOUNT_SECRET=${{ secrets.GOOGLE_ACCOUNT_SECRET }} >> .env
          echo GOOGLE_ACCOUNT_TOKEN=${{ secrets.GOOGLE_ACCOUNT_TOKEN }} >> .env
          echo GOOGLE_ACCOUNT_OAUTH_REDIRECT=${{ vars.GOOGLE_ACCOUNT_OAUTH_REDIRECT }} >> .env
          echo SLACK_APP_TOKEN=${{ secrets.SLACK_APP_TOKEN }} >> .env
          echo SLACK_OAUTH_TOKEN=${{ secrets.SLACK_OAUTH_TOKEN }} >> .env
          echo SLACK_SIGNING_SECRET=${{ secrets.SLACK_SIGNING_SECRET }} >> .env
          echo DEPLOY_COMMIT_SHA=${{ github.sha }} >> .env
      - name: Move files to dist
        run: |
          mv .env ./dist/
          mv ./deploy/development/ecosystem.config.js ./dist/
      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_KEY }}
          source: dist/
          target: ~/minerva-dev/
          strip_components: 1
      - name: Start pm2 process and monitor startup
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_KEY }}
          script: |
            cd ~/minerva-dev

            echo "Starting the application with PM2."
            pm2 start ecosystem.config.js 

            echo "Waiting for the application to stabilize."
            sleep 10 

            # Check if PM2 started the application successfully
            echo "Checking PM2 process status..."
            if pm2 jlist | jq -e 'any(.[]; .name == "minerva-dev" and .pm2_env.status == "online")' > /dev/null; then
              echo "PM2 application is running."
              exit 0
            else
              echo "PM2 application has failed to start."
              exit 1
            fi
